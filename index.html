<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediSearch</title>
  <meta name="theme-color" content="#1E40AF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="light-theme">
  <!-- Header -->
  <header class="header" id="header">
    <div class="header-inner">
      <!-- Mobile left: hamburger -->
      <button class="mobile-menu-btn" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="logo" id="logo">
        <div class="logo-icon">
          <!-- Heart with plus -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            <path d="M11 7v3H8v2h3v3h2v-3h3v-2h-3V7h-2z" fill="var(--bg-base)" />
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-name">MediSearch</span>
        </div>
      </div>

      <!-- Right actions -->
      <div class="header-actions">
        <span class="desktop-date">Updated: 16 Jul 2026</span>
        <span class="desktop-dot">•</span>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <!-- Mobile right: bell -->
        <button class="mobile-notification-btn" aria-label="Notifications">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="search-section">
      <h1 class="page-title">Search Medicines</h1>
      <p class="page-subtitle">Find medicines available in the hospital</p>

      <div class="search-container" id="search-container">
        <div class="search-box" id="search-box">
          <svg class="search-icon-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search medicine..." autocomplete="off">

          <button class="clear-btn" id="clear-btn" aria-label="Clear search" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>

          <button class="search-submit-btn" id="search-submit-btn" aria-label="Search">
            <svg class="search-icon-btn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>

          <div class="suggestions-dropdown" id="suggestions-dropdown"></div>
        </div>
      </div>
    </div>

    <!-- Category Pills / Cards -->
    <section class="categories-section" id="categories-section">
      <div class="categories-header">
        <h2 class="categories-title">Categories</h2>
      </div>
      <div class="category-grid" id="category-grid">
        <!-- Generated by JS -->
      </div>

      <!-- View all on mobile -->
      <button class="view-all-btn" id="view-all-btn">
        View all categories
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </section>

    <!-- Results Area (Initially hidden or shown on search) -->
    <section class="results-section" id="results-section" style="display: none;">
      <div class="results-meta" id="results-meta">
        <h2 class="categories-title">Search Results</h2>
        <span class="results-count" id="results-count">0 medicines</span>
        <!-- Go back button -->
        <button id="back-to-categories" class="back-btn" style="display:none;">Back to Categories</button>
      </div>
      <div class="results-grid" id="results-grid"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <p class="empty-text">No medicines found.</p>
      </div>
    </section>
  </main>

  <!-- Desktop Footer -->
  <footer class="footer desktop-only">
    <p>MediSearch &middot; Built for doctors. Designed for care.</p>
  </footer>


  <!-- Drug Detail Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
